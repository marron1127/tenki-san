<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東予3市 Dynamic Weather</title>
    <style>
        :root {
            --bg-color: #f0f8ff;
            --accent-color: #333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg-color);
            transition: background 1s ease;
        }

        /* 日時表示エリアをさらに巨大化 */
        #current-datetime {
            font-size: 3.5rem; /* 2.2rem -> 3.5rem に大幅アップ */
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            padding: 20px 60px; /* 横の余白も広げてゆったりと */
            border-radius: 60px;
            margin-top: 20px;
            margin-bottom: 10px; /* カードとの間の余白 */
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            animation: fadeIn 1s forwards ease-out;
            text-align: center;
        }

        /* コンテナの幅 */
        .weather-container {
            display: flex;
            gap: 30px;
            padding: 20px 40px 40px 40px;
            max-width: 1400px;
            width: 100%;
            justify-content: center;
            box-sizing: border-box;
            flex-wrap: wrap;
        }

        /* カードのスタイル */
        .weather-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.08);
            transform: translateY(50px);
            opacity: 0;
            animation: floatIn 1s forwards ease-out;
            flex: 1;
            min-width: 320px;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .weather-card:nth-child(1) { animation-delay: 0s; }
        .weather-card:nth-child(2) { animation-delay: 0.2s; }
        .weather-card:nth-child(3) { animation-delay: 0.4s; }

        @keyframes floatIn {
            to { transform: translateY(0); opacity: 1; }
        }

        /* アイコン */
        .icon {
            font-size: 110px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .bounce { animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .spin { animation: spin 10s infinite linear; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 文字サイズ */
        .temp { font-size: 5rem; font-weight: bold; color: var(--accent-color); margin: 15px 0; }
        .status { font-size: 1.8rem; color: #666; font-weight: bold; }
        .location { font-size: 1.4rem; background: #333; color: #fff; padding: 8px 24px; border-radius: 25px; display: inline-block; }
        .last-update { font-size: 0.95rem; color: #999; margin-top: 25px; }
    </style>
</head>
<body>

    <div id="current-datetime">----年--月--日 (水) --:--:--</div>

    <div class="weather-container">
        <div class="weather-card" id="saijo">
            <div class="location">西条市</div>
            <div class="icon">⏳</div>
            <div class="status">Loading...</div>
            <div class="temp">--°C</div>
            <div class="last-update"></div>
        </div>

        <div class="weather-card" id="niihama">
            <div class="location">新居浜市</div>
            <div class="icon">⏳</div>
            <div class="status">Loading...</div>
            <div class="temp">--°C</div>
            <div class="last-update"></div>
        </div>

        <div class="weather-card" id="shikokuchuo">
            <div class="location">四国中央市</div>
            <div class="icon">⏳</div>
            <div class="status">Loading...</div>
            <div class="temp">--°C</div>
            <div class="last-update"></div>
        </div>
    </div>

    <script>
        const CITIES = [
            { id: 'saijo', lat: 33.91, lon: 133.18 },
            { id: 'niihama', lat: 33.96, lon: 133.28 },
            { id: 'shikokuchuo', lat: 33.98, lon: 133.54 }
        ];

        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayList = ['日', '月', '火', '水', '木', '金', '土'];
            const day = dayList[now.getDay()];
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('current-datetime').innerText = 
                `${year}年${month}月${date}日 (${day}) ${hours}:${minutes}:${seconds}`;
        }

        async function updateWeather() {
            try {
                const lats = CITIES.map(c => c.lat).join(',');
                const lons = CITIES.map(c => c.lon).join(',');
                
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current_weather=true&timezone=Asia%2FTokyo`);
                const data = await response.json();

                const weatherDataArray = Array.isArray(data) ? data : [data];

                let totalColorR = 0, totalColorG = 0, totalColorB = 0;

                weatherDataArray.forEach((weatherData, index) => {
                    const { temperature, weathercode } = weatherData.current_weather;
                    const city = CITIES[index];
                    
                    let info = { text: "不明", icon: "❓", color: "#f0f8ff", animate: "" };
                    
                    if (weathercode === 0) {
                        info = { text: "快晴", icon: "☀️", color: "#fff9e6", animate: "spin" };
                    } else if (weathercode <= 3) {
                        info = { text: "晴れ・曇り", icon: "🌤", color: "#e6f7ff", animate: "bounce" };
                    } else if (weathercode >= 61) {
                        info = { text: "雨", icon: "☔", color: "#e1e1f5", animate: "bounce" };
                    }

                    const hex = info.color.replace('#', '');
                    totalColorR += parseInt(hex.substring(0, 2), 16);
                    totalColorG += parseInt(hex.substring(2, 4), 16);
                    totalColorB += parseInt(hex.substring(4, 6), 16);

                    const card = document.getElementById(city.id);
                    
                    const iconEl = card.querySelector('.icon');
                    iconEl.innerText = info.icon;
                    iconEl.className = `icon ${info.animate}`;
                    
                    card.querySelector('.status').innerText = info.text;
                    card.querySelector('.temp').innerText = `${temperature}°C`;
                    card.querySelector('.last-update').innerText = `取得時刻: ${new Date().toLocaleTimeString()}`;
                });

                const avgR = Math.round(totalColorR / CITIES.length);
                const avgG = Math.round(totalColorG / CITIES.length);
                const avgB = Math.round(totalColorB / CITIES.length);
                document.body.style.backgroundColor = `rgb(${avgR}, ${avgG}, ${avgB})`;

            } catch (e) {
                console.error("エラーだね", e);
            }
        }

        updateClock();
        setInterval(updateClock, 1000);

        updateWeather();
        setInterval(updateWeather, 3600000);
    </script>
</body>
</html>
