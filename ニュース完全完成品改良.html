<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>愛媛ニュースサイネージ・完全自動版</title>
    <style>
        /* デザイン設定 */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background: linear-gradient(135deg, #ffcc80 0%, #ffab91 100%);
            color: #333;
        }

        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1624365111100-3490b8f04c00?q=80&w=2000'); 
            background-size: cover; background-position: center; opacity: 0.1; z-index: -1;
        }

        .clock-container {
            position: absolute; top: 30px; right: 50px; text-align: right; font-weight: bold;
            background: rgba(255, 255, 255, 0.4); color: #d84315; padding: 10px 25px; border-radius: 15px;
            backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            z-index: 20;
        }
        #clock-time { font-size: 6rem; margin: 0; line-height: 1; }
        #clock-date { font-size: 3rem; margin: 0; opacity: 0.8; margin-top: 10px; }

        .container { display: flex; flex-direction: column; justify-content: center; height: 100vh; padding-left: 4%; width: 65%; }
        .header-label { font-size: 1.5rem; letter-spacing: 5px; margin-bottom: 10px; color: #e65100; font-weight: bold; }
        
        /* ニュース表示エリア */
        #news-display { 
            transition: opacity 0.6s ease, transform 0.6s ease; 
            opacity: 1;
            transform: translateX(0);
        }
        #news-display.fade-out { 
            opacity: 0; 
            transform: translateX(-20px); 
        }

        .category { display: inline-block; background: #e65100; color: #fff; padding: 5px 20px; border-radius: 3px; font-size: 1.4rem; font-weight: bold; margin-bottom: 20px; }
        .title { 
            font-size: 5rem; 
            line-height: 1.3; 
            font-weight: 900; 
            color: #212121; 
            text-shadow: 1px 1px 10px rgba(255,255,255,0.8); 
            min-height: 250px;
            word-break: break-word; /* 長いタイトルのはみ出し防止 */
        }

        /* 右下画像1 */
        .mican-box {
            position: absolute; bottom: 80px; right: 5%; width: 250px; height: 250px;
            background-image: url('dark.png');
            background-size: contain; background-repeat: no-repeat; background-position: bottom right;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.2)); z-index: 10;
        }

        /* 右下画像2 */
        .second-image-box {
            position: absolute; 
            bottom: 80px; 
            right: calc(5% + 280px);
            width: 250px;
            height: 250px;
            background-image: url('mican.png');
            background-size: contain; 
            background-repeat: no-repeat; 
            background-position: bottom right;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.2)); 
            z-index: 10;
        }

        /* テロップ部分 */
        .ticker-wrap {
            position: absolute; bottom: 0; width: 100%; height: 60px;
            background: rgba(230, 81, 0, 0.9); overflow: hidden; display: flex;
        }
        .ticker-content {
            display: flex; white-space: nowrap; animation: ticker-loop 35s linear infinite;
        }
        .ticker-item {
            font-size: 2rem; font-weight: bold; color: #fff; padding-right: 50px; line-height: 60px;
        }
        @keyframes ticker-loop {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <p id="clock-time">--:--</p>
        <p id="clock-date">----.--.-- ---</p>
    </div>

    <div class="container">
        <div class="header-label">EHIME LIVE NEWS</div>
        <div id="news-display">
            <div class="category" id="category-label">最新のニュース</div>
            <div class="title" id="title">愛媛のニュースを取得中...</div>
        </div>
    </div>

    <div class="mican-box"></div>
    <div class="second-image-box"></div>

    <div class="ticker-wrap">
        <div class="ticker-content">
            <div class="ticker-item">きてみんけん、愛媛へ。道後温泉、しまなみ海道、石鎚山…愛媛の情報をお届けしています。</div>
            <div class="ticker-item">きてみんけん、愛媛へ。道後温泉、しまなみ海道、石鎚山…愛媛の情報をお届けしています。</div>
        </div>
    </div>

    <script>
        let newsArticles = [];
        let currentIndex = 0;
        let rotationInterval = null;

        // 【オフライン用保険データ】キャッシュすら無い状態の極限環境用
        const fallbackArticles = [
            { title: "きてみんけん、愛媛へ！道後温泉や石鎚山など自然豊かな愛媛の情報をお届け中。" },
            { title: "しまなみ海道はサイクリストの聖地として全国・世界から愛されています。" },
            { title: "愛媛県産の温州みかん・柑橘類が旬を迎えています。" }
        ];

        function removeSimilarNews(articles) {
            const uniqueArticles = [];
            const seenLinks = new Set();

            function normalize(text) {
                return (text || '')
                    .replace(/<[^>]*>/g, '')
                    .replace(/&nbsp;/g, ' ')
                    .replace(/&amp;/g, '&')
                    .replace(/[【】「」『』（）()、。！!？?・\s：:]/g, '')
                    .toLowerCase();
            }

            function getFeatures(text) {
                const result = new Set();
                [2, 3].forEach(size => {
                    for (let i = 0; i <= text.length - size; i++) {
                        result.add(text.substring(i, i + size));
                    }
                });
                return result;
            }

            function similarity(text1, text2) {
                const a = getFeatures(text1);
                const b = getFeatures(text2);
                if (!a.size || !b.size) return 0;
                let common = 0;
                a.forEach(word => { if (b.has(word)) common++; });
                return (2 * common) / (a.size + b.size);
            }

            function dateIsClose(date1, date2) {
                const d1 = new Date(date1).getTime();
                const d2 = new Date(date2).getTime();
                if (!Number.isFinite(d1) || !Number.isFinite(d2)) return true;
                return Math.abs(d1 - d2) <= 48 * 60 * 60 * 1000;
            }

            articles.forEach(item => {
                const title = normalize(item.title);
                const description = normalize(item.description);
                const link = item.link || '';

                if (!title) return;
                if (link && seenLinks.has(link)) return;

                const isDuplicate = uniqueArticles.some(old => {
                    if (!dateIsClose(item.pubDate, old.pubDate)) return false;
                    const oldTitle = normalize(old.title);
                    const oldDescription = normalize(old.description);
                    const titleScore = similarity(title, oldTitle);
                    const descriptionScore = description && oldDescription ? similarity(description, oldDescription) : titleScore;
                    return (titleScore * 0.65 + descriptionScore * 0.35) >= 0.25;
                });

                if (!isDuplicate) {
                    uniqueArticles.push(item);
                    if (link) seenLinks.add(link);
                }
            });

            return uniqueArticles;
        }

        async function fetchNews() {
            const RSS_URL = 'https://news.google.com/rss/search?q=愛媛&hl=ja&gl=JP&ceid=JP:ja';
            const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.status === 'ok' && data.items.length > 0) {
                    const cleaned = removeSimilarNews(data.items);
                    if (cleaned.length > 0) {
                        newsArticles = cleaned;
                        // 成功した最新ニュースデータ一式をローカルストレージ（キャッシュ）に保存
                        localStorage.setItem('ehime_news_cache', JSON.stringify(newsArticles));
                    }
                } else {
                    throw new Error('API fetch unsuccessful');
                }
            } catch (error) {
                console.warn("ニュース取得失敗。ローカルキャッシュまたは保険データに切り替えます:", error);
                
                // 1. 過去に通信成功したキャッシュがあればそれを使用
                const savedCache = localStorage.getItem('ehime_news_cache');
                if (savedCache) {
                    newsArticles = JSON.parse(savedCache);
                } else {
                    // 2. キャッシュも無ければ固定のフォールバックを使用
                    newsArticles = fallbackArticles;
                }
            }

            // ループ表示の起動
            if (!rotationInterval && newsArticles.length > 0) {
                updateDisplay();
                rotationInterval = setInterval(updateDisplay, 10000);
            }
        }

        function updateDisplay() {
            if (newsArticles.length === 0) return;

            const display = document.getElementById('news-display');
            display.classList.add('fade-out');

            setTimeout(() => {
                const item = newsArticles[currentIndex];
                const titleEl = document.getElementById('title');
                
                let cleanTitle = item.title ? item.title.split(' - ')[0] : item.title; 
                titleEl.textContent = cleanTitle;

                // 文字数に応じたきめ細やかな文字サイズ微調整（画面はみ出し防止）
                if (cleanTitle.length > 45) {
                    titleEl.style.fontSize = "3.2rem";
                } else if (cleanTitle.length > 30) {
                    titleEl.style.fontSize = "4rem";
                } else {
                    titleEl.style.fontSize = "5rem";
                }

                display.classList.remove('fade-out');
                currentIndex = (currentIndex + 1) % newsArticles.length;
            }, 600); 
        }

        function updateClock() {
            const now = new Date();
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            
            document.getElementById('clock-time').textContent = 
                `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            document.getElementById('clock-date').textContent = 
                `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${days[now.getDay()]}`;
        }

        setInterval(fetchNews, 3600000); // 1時間ごとに再取得
        setInterval(updateClock, 1000);    // 1秒ごとに時計更新

        updateClock();
        fetchNews();
    </script>
</body>
</html>
