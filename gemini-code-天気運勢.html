<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東予お天気・血液型占いプレミアム</title>
    <style>
        :root {
            --bg-color: #fffaf0;
            --niihama-color: #ff5e99;
            --saijo-color: #8edb4d;
            --shikoku-color: #00d2ff;
            --text-color: #4e342e;
            --clock-color: #ff1744;
            --panel-bg: #ffffff;
            --advice-bg: #f0fdf0;
            --advice-border: #4caf50;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            font-family: "Hiragino Maru Gothic ProN", "Corporate Logo Rounded", sans-serif;
            color: var(--text-color);
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            gap: 20px;
            width: 98vw;
            height: 98vh;
            padding: 10px;
        }

        /* 左側：お天気エリア（大きく配置） */
        .left-side {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1.8;
            height: 100%;
        }

        #clock-panel {
            background: var(--panel-bg);
            border-radius: 35px;
            box-shadow: 0 8px 0 #ffd1dc;
            height: calc(100% / 4 - 9px);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #ffebf0;
        }
        
        #current-time {
            font-size: 6vw;
            font-weight: 900;
            color: var(--clock-color);
            line-height: 1;
        }

        .weather-panel {
            background: var(--panel-bg);
            border-radius: 35px;
            padding: 10px 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05);
            height: calc(100% / 4 - 9px);
            display: flex;
            align-items: center;
            justify-content: space-around;
            border: 3px solid #f0f0f0;
        }

        .city-label {
            font-size: 1.5rem;
            font-weight: 900;
            color: white;
            padding: 8px 25px;
            border-radius: 50px;
            min-width: 180px;
            text-align: center;
        }

        .weather-mark { font-size: 10vh; line-height: 1; }
        .temp { font-size: 9vh; font-weight: 900; line-height: 1; }

        /* 右側：占いエリア */
        #fortune-panel {
            flex: 1.6;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 45px;
            display: flex;
            flex-direction: column;
            border: 7px solid #ffd600;
            box-shadow: 0 10px 0 #fbc02d;
            height: 100%;
        }

        .fortune-header {
            font-size: 1.5rem;
            font-weight: 900;
            color: #f57c00;
            text-align: center;
            margin-bottom: 10px;
            background: #fff9c4;
            padding: 6px;
            border-radius: 20px;
        }

        .blood-row {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px dashed #fff176;
            padding: 5px 0;
        }
        .blood-row:last-child { border-bottom: none; }

        .blood-type {
            font-size: 3.2rem;
            font-weight: 900;
            color: #ff5252;
            width: 65px;
            text-align: center;
        }

        /* 運勢：改行禁止設定 */
        .rank-label {
            font-size: 1.15rem;
            font-weight: 900;
            color: #5d4037;
            width: 90px;
            text-align: center;
            white-space: nowrap; /* 改行を禁止 */
        }

        .advice-box {
            flex: 1;
            background: var(--advice-bg);
            border: 4px solid var(--advice-border);
            border-radius: 25px;
            padding: 10px;
            height: 85%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: #2e7d32;
            line-height: 1.3;
        }

        .color-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 70px;
        }

        /* ラッキーカラー：白の縁取りを実装 */
        .color-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 5px solid #ffffff; /* 白で囲む */
            outline: 2px solid #e0e0e0; /* 白を目立たせるための薄い外枠 */
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .color-name { font-size: 0.75rem; font-weight: 900; color: #8d6e63; margin-top: 4px; }

    </style>
</head>
<body>

    <div class="main-layout">
        <div class="left-side">
            <div id="clock-panel"><p id="current-time">00:00:00</p></div>
            <div class="weather-panel">
                <div class="city-label" style="background: var(--saijo-color);">西条市</div>
                <div id="mark-saijo" class="weather-mark">☀️</div>
                <div id="temp-saijo" class="temp" style="color: var(--saijo-color);">--.-°C</div>
            </div>
            <div class="weather-panel">
                <div class="city-label" style="background: var(--niihama-color);">新居浜市</div>
                <div id="mark-niihama" class="weather-mark">☀️</div>
                <div id="temp-niihama" class="temp" style="color: var(--niihama-color);">--.-°C</div>
            </div>
            <div class="weather-panel">
                <div class="city-label" style="background: var(--shikoku-color);">四国中央市</div>
                <div id="mark-shikoku" class="weather-mark">☀️</div>
                <div id="temp-shikoku" class="temp" style="color: var(--shikoku-color);">--.-°C</div>
            </div>
        </div>

        <div id="fortune-panel">
            <div class="fortune-header">🗓 今日の血液型占い</div>
            <div id="fortune-list" style="flex:1; display:flex; flex-direction:column;"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            document.getElementById('current-time').innerText = new Date().toLocaleTimeString('ja-JP', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        const bloodTypes = ["A", "B", "O", "AB"];
        const ranks = ["👑最高！", "✨絶好調", "👍まずまず", "🍵のんびり"];
        
        // アドバイスのバリエーションを大幅追加
        const advices = [
            "勉強がサクサク進む日！", "自販機で当たりが出るかも", "忘れ物に気をつけてね", "深呼吸で集中力がUP！",
            "お菓子が最高に美味しい日", "計算ミスに注意すれば無敵", "友達と楽しい話ができるよ", "今日は早めに寝るのが吉",
            "欲しかった物が手に入る予感", "苦手なことが克服できるかも", "笑顔でいると良いことあるよ", "掃除をすると運気アップ！",
            "新しい発見がある一日になる", "勇気を出して話しかけてみて", "読書をすると心が落ち着くよ", "ラッキーな連絡が届きそう",
            "直感を信じて動いてみて！", "歩くスピードを上げると吉", "空を見上げるとリフレッシュ", "感謝の言葉を伝えてみてね",
            "今日は自分のペースを大切に", "素敵なアイデアが閃くかも！", "身の回りを整えるとスッキリ", "美味しい飲み物で一息ついて",
            "意外な場所で知り合いに会う", "自信を持って取り組んでOK", "予定を詰め込みすぎないでね", "小さな幸せを見つけられる日"
        ];
        
        const colors = [
            {n:"赤", c:"#ff5252"}, {n:"青", c:"#448aff"}, {n:"黄", c:"#ffd600"}, 
            {n:"緑", c:"#4caf50"}, {n:"桃", c:"#ff80ab"}, {n:"橙", c:"#ff9100"}, {n:"紫", c:"#b388ff"},
            {n:"白", c:"#f5f5f5"}, {n:"黒", c:"#333333"}, {n:"水色", c:"#81d4fa"}
        ];

        function updateFortune() {
            const today = new Date();
            const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
            const list = document.getElementById('fortune-list');
            list.innerHTML = "";
            const shuffled = [...bloodTypes].sort((a, b) => seededRandom(seed + a.charCodeAt(0)) - 0.5);
            
            shuffled.forEach((type, index) => {
                const row = document.createElement('div');
                row.className = 'blood-row';
                const adIdx = Math.floor(seededRandom(seed + index) * advices.length);
                const color = colors[Math.floor(seededRandom(seed + index + 10) * colors.length)];
                
                row.innerHTML = `
                    <div class="blood-type">${type}</div>
                    <div class="rank-label">${ranks[index]}</div>
                    <div class="advice-box">${advices[adIdx]}</div>
                    <div class="color-section">
                        <div class="color-circle" style="background-color: ${color.c}"></div>
                        <div class="color-name">${color.n}</div>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        async function fetchWeather(cityKey) {
            try {
                const coords = { saijo: [33.91, 133.18], niihama: [33.96, 133.28], shikoku: [33.98, 133.54] };
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords[cityKey][0]}&longitude=${coords[cityKey][1]}&current_weather=true&timezone=Asia%2FTokyo`);
                const data = await res.json();
                let temp = data.current_weather.temperature;
                if(cityKey === 'niihama') temp += 1.7;
                document.getElementById(`temp-${cityKey}`).innerText = temp.toFixed(1) + "°C";
                const marks = { 0: "☀️", 1: "🌤", 2: "⛅", 3: "☁️", 61: "☔", 63: "☔" };
                document.getElementById(`mark-${cityKey}`).innerText = marks[data.current_weather.weathercode] || "✨";
            } catch (e) { console.error(e); }
        }

        ['saijo', 'niihama', 'shikoku'].forEach(fetchWeather);
        updateFortune();
        setInterval(() => ['saijo', 'niihama', 'shikoku'].forEach(fetchWeather), 3600000);
    </script>
</body>
</html>
