<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東予天気サイネージ</title>
    <style>
        body {
            background: #2c3e50;
            color: white;
            font-family: 'Meiryo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #clock {
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .container {
            display: flex;
            gap: 15px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 20px;
            width: 380px; /* 12時間分並べるために少し広げました */
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .city-name { font-size: 28px; font-weight: bold; color: #00d4ff; margin-bottom: 5px; }
        
        /* 今の天気 */
        .current-box { margin-bottom: 15px; }
        .current-temp { font-size: 40px; font-weight: bold; }
        
        /* 12時間予報の並び */
        .forecast-container {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 10px;
        }
        .forecast-item { flex: 1; font-size: 12px; }
        .forecast-time { color: #aaa; margin-bottom: 3px; }
        .forecast-icon { font-size: 20px; margin: 3px 0; }
    </style>
</head>
<body>

    <div id="clock">00:00</div>

    <div class="container" id="weather-app">
        </div>

    <script>
        const API_KEY = '20228cf3b2541301b471001665af39a9';
        const CITIES = [
            { name: '新居浜', lat: 33.9601, lon: 133.2831 },
            { name: '西条', lat: 33.9189, lon: 133.1818 },
            { name: '四国中央', lat: 33.9833, lon: 133.5417 }
        ];

        // 時計を更新
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 天気アイコンを判定する関数
        function getWeatherIcon(desc) {
            if (desc.includes('雨')) return '☔';
            if (desc.includes('雷')) return '⚡';
            if (desc.includes('雪')) return '❄️';
            if (desc.includes('雲') || desc.includes('くもり')) return '☁️';
            return '☀️';
        }

        async function updateWeather() {
            const app = document.getElementById('weather-app');
            let html = '';

            for (const city of CITIES) {
                try {
                    const res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${city.lat}&lon=${city.lon}&appid=${API_KEY}&units=metric&lang=ja`);
                    const data = await res.json();
                    
                    const current = data.list[0];
                    
                    // 予報部分（3時間おき×4つ ＝ 12時間分）のHTML作成
                    let forecastHtml = '';
                    for (let i = 1; i <= 4; i++) {
                        const f = data.list[i];
                        const time = new Date(f.dt * 1000).getHours() + "時";
                        forecastHtml += `
                            <div class="forecast-item">
                                <div class="forecast-time">${time}</div>
                                <div class="forecast-icon">${getWeatherIcon(f.weather[0].description)}</div>
                                <div>${Math.round(f.main.temp)}°</div>
                            </div>
                        `;
                    }

                    html += `
                        <div class="card">
                            <div class="city-name">${city.name}</div>
                            <div class="current-box">
                                <div class="current-temp">${Math.round(current.main.temp)}°C</div>
                                <div style="font-size:18px">${current.weather[0].description}</div>
                            </div>
                            <div class="forecast-container">
                                ${forecastHtml}
                            </div>
                        </div>
                    `;
                } catch (e) {
                    html += `<div class="card">データ取得エラー</div>`;
                }
            }
            app.innerHTML = html;
        }

        // 1時間おきに更新
        setInterval(updateWeather, 3600000);
        updateWeather();
    </script>
</body>
</html>
