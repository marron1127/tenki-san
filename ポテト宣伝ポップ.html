
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シャカシャカポテト 宣伝ポップ</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@900&display=swap" rel="stylesheet">
<style>
body {
font-family: 'M PLUS Rounded 1c', sans-serif;
margin: 0;
padding: 0;
width: 100vw;
height: 100vh;
overflow: hidden;
background: linear-gradient(135deg, #ff0055, #ffaa00);

<div style="background: #ffcc00; color: #000; font-size: 2.5rem; font-weight: 900; padding: 10px 40px; border-radius: 50px; margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">

<div>

<div style="font-size: 4rem; font-weight: 900; background: #000; color: #ffcc00; padding: 15px 40px; border-radius: 30px; display: inline-block; margin-top: 20px; border: 4px solid #fff;">
小 200円 / 大 300円
</div>
</div>

<!-- 下部：味の紹介 -->
<div style="font-size: 2rem; font-weight: 900; background: rgba(0,0,0,0.4); width: 100%; padding: 15px; display: flex; justify-content: center; gap: 30px;">
